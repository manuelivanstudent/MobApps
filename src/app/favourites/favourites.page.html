<ion-header [translucent]="true">
  <ion-toolbar>

    <ion-title>
      G00472904
    </ion-title>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-list>
    <ion-item *ngFor="let movie of favourites" (click)="openMovie(movie)">

      <ion-thumbnail slot="start">
        <img [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path">
      </ion-thumbnail>

      <ion-label>
        <h2>{{ movie.title }}</h2>
        <p>{{ movie.overview }}</p>
      </ion-label>

      <ion-button fill="clear" color="danger" (click)="remove(movie.id); $event.stopPropagation()">
        <ion-icon name="trash"></ion-icon>
      </ion-button>

    </ion-item>
  </ion-list>

  <div *ngIf="favourites.length === 0" style="text-align:center; margin-top:40px;">
    <h2>No favourites yet</h2>
  </div>

</ion-content>
